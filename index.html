<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Module v2</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent:      #9644ed;
    --accent-hov:  #7b28d8;
    --accent-glow: rgba(150,68,237,0.40);
    --accent-dim:  rgba(150,68,237,0.18);
    --white:       #ffffff;
    --w80:         rgba(255,255,255,0.80);
    --w55:         rgba(255,255,255,0.55);
    --w20:         rgba(255,255,255,0.20);
    --w10:         rgba(255,255,255,0.10);
    --w06:         rgba(255,255,255,0.06);
    --bg:          #000000;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    font-family: 'Calibri', 'Carlito', 'Trebuchet MS', Arial, sans-serif;
    color: var(--white);
    overflow: hidden;
  }

  /* ── CANVAS ── */
  .canvas {
    width: 100%; height: 100%;
    background: #000;
    display: flex;
    flex-direction: column;
    padding: clamp(0.7rem,2.5vh,1.4rem) clamp(0.7rem,2.5vw,1.4rem);
    gap: clamp(0.5rem,1.5vh,0.9rem);
  }

  /* ── TOP PROGRESS BAR ── */
  .top-bar {
    flex-shrink: 0;
    height: clamp(3px,0.5vh,5px);
    background: var(--w10);
    border-radius: 100px;
    overflow: hidden;
  }
  .top-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 100px;
    box-shadow: 0 0 8px var(--accent-glow);
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }

  /* ── STAGE ── */
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    position: relative;
  }

  /* ── VIDEO CARD ── */
  .video-card {
    width: min(860px, 92vw);
    height: 100%;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--w10);
    border-radius: clamp(8px,1.5vw,14px);
    background: #0a0a0a;
    overflow: hidden;
    transition: border-color .3s, box-shadow .3s;
  }
  .video-card.active  { border-color: var(--accent); box-shadow: 0 0 24px rgba(150,68,237,.12); }
  .video-card.visited { border-color: rgba(150,68,237,.3); }

  /* ── VIDEO PLAYER AREA ── */
  .player-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    flex-shrink: 0;
    overflow: hidden;
  }

  .player-wrap video {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    background: #000;
  }

  /* big play overlay (shown when paused / not started) */
  .play-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.45);
    cursor: pointer;
    transition: opacity .25s;
  }
  .play-overlay.hidden { opacity: 0; pointer-events: none; }

  .big-play-btn {
    width: clamp(44px,7vw,68px);
    height: clamp(44px,7vw,68px);
    border-radius: 50%;
    background: var(--accent);
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background .2s, transform .2s, box-shadow .2s;
    box-shadow: 0 4px 20px rgba(150,68,237,.5);
  }
  .big-play-btn:hover { background: var(--accent-hov); transform: scale(1.08); }
  .big-play-btn svg { width: 40%; height: 40%; fill: #fff; margin-left: 3px; }

  /* nav arrows on video */
  .nav-arrow {
    position: absolute;
    top: 0; bottom: 0;
    width: clamp(40px,6vw,60px);
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    border: none;
    color: #fff;
    cursor: pointer;
    opacity: 0;
    transition: opacity .25s, background .2s;
    z-index: 8;
  }
  .nav-arrow.prev { left: 0; }
  .nav-arrow.next { right: 0; }
  .player-wrap:hover .nav-arrow { opacity: 1; }
  .nav-arrow:hover { background: rgba(0,0,0,.35); }
  .nav-arrow:disabled { opacity: 0 !important; pointer-events: none; }
  .nav-arrow svg { width: clamp(22px,3.5vw,32px); height: clamp(22px,3.5vw,32px); fill: currentColor; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }

  /* error state */
  .video-error {
    display: none;
    position: absolute; inset: 0;
    align-items: center; justify-content: center; flex-direction: column; gap: 8px;
    background: rgba(0,0,0,.85);
    color: var(--w55);
    font-size: clamp(.68rem,1.4vw,.82rem);
    text-align: center;
    padding: 1rem;
  }
  .video-error.show { display: flex; }
  .video-error svg { width: 30px; height: 30px; fill: rgba(150,68,237,.55); }

  /* ── CUSTOM CONTROLS BAR ── */
  .controls-bar {
    flex-shrink: 0;
    background: #111;
    padding: 6px 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* seek row */
  .seek-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .time-label {
    font-size: clamp(.55rem,1.1vw,.68rem);
    color: var(--w55);
    white-space: nowrap;
    min-width: 72px;
    text-align: right;
  }

  /* seek / volume sliders */
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 100px;
    background: var(--w20);
    cursor: pointer;
    outline: none;
    transition: height .15s;
  }
  input[type=range]:hover { height: 6px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent-glow);
    cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
  }
  /* gradient fill via inline style on the range */
  input[type=range].seek-input {
    background: linear-gradient(to right, var(--accent) 0%, var(--w20) 0%);
  }
  input[type=range].vol-input {
    width: 70px;
    flex: none;
    background: linear-gradient(to right, var(--w55) 0%, var(--w20) 0%);
  }

  /* bottom controls row */
  .ctrl-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* small icon buttons */
  .ctrl-btn {
    background: none;
    border: none;
    color: var(--w80);
    cursor: pointer;
    padding: 3px;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    transition: color .2s, background .2s;
  }
  .ctrl-btn:hover { color: #fff; background: var(--w10); }
  .ctrl-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .ctrl-btn.play-pause-btn svg { width: 20px; height: 20px; }

  /* speed selector */
  .speed-select {
    background: var(--w06);
    border: 1px solid var(--w20);
    color: var(--w80);
    font-size: clamp(.55rem,1vw,.65rem);
    font-family: inherit;
    border-radius: 4px;
    padding: 2px 4px;
    cursor: pointer;
    outline: none;
  }
  .speed-select:hover { border-color: var(--accent); }
  .speed-select option { background: #1a1a1a; }

  /* spacer */
  .ctrl-spacer { flex: 1; }

  /* volume row */
  .vol-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* ── THUMBNAIL STRIP ── */
  .thumb-strip {
    flex-shrink: 0;
    display: flex;
    gap: clamp(.35rem,.8vw,.6rem);
    justify-content: center;
    padding: clamp(.25rem,.8vh,.4rem) 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .thumb-strip::-webkit-scrollbar { display: none; }

  .thumb {
    flex-shrink: 0;
    width: clamp(52px,9vw,76px);
    aspect-ratio: 16/9;
    border-radius: 5px;
    overflow: hidden;
    border: 2px solid transparent;
    cursor: pointer;
    position: relative;
    background: var(--w06);
    transition: border-color .25s, transform .25s, box-shadow .25s;
  }
  .thumb:hover { border-color: rgba(150,68,237,.4); transform: translateY(-2px); }
  .thumb.active { border-color: var(--accent); box-shadow: 0 0 10px rgba(150,68,237,.35); }
  .thumb.visited::after {
    content: '';
    position: absolute; top: 3px; right: 3px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 4px var(--accent-glow);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; opacity: .6; transition: opacity .25s; }
  .thumb.active img, .thumb:hover img { opacity: 1; }
  .thumb-num {
    position: absolute; bottom: 2px; left: 3px;
    font-size: clamp(.45rem,.9vw,.6rem);
    font-weight: 600;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }
  .thumb-fallback {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(150,68,237,.1);
    color: var(--w20);
    font-size: clamp(.55rem,1vw,.68rem);
    font-weight: 600;
  }

  /* ── DOTS ── */
  .dots {
    flex-shrink: 0;
    display: flex;
    gap: 5px;
    justify-content: center;
    padding: 2px 0;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--w20);
    cursor: pointer;
    transition: all .25s;
  }
  .dot:hover { background: rgba(150,68,237,.5); }
  .dot.active { background: var(--accent); width: 18px; border-radius: 100px; box-shadow: 0 0 8px var(--accent-glow); }
  .dot.watched { background: rgba(150,68,237,.45); }

  /* ── FOOTER ── */
  .footer {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: clamp(.35rem,.9vh,.55rem);
    border-top: 1px solid var(--w10);
  }
  .prog-text { font-size: clamp(.58rem,1.2vw,.7rem); color: var(--w55); }
  .prog-text strong { color: var(--accent); font-weight: 600; }
  .completion-lbl { font-size: clamp(.58rem,1.2vw,.7rem); color: var(--w55); }

  /* ── TOOLTIP ── */
  .tooltip {
    position: fixed;
    background: rgba(0,0,0,.95);
    border: 1px solid var(--accent);
    border-radius: 7px;
    padding: 6px 10px;
    font-size: clamp(.58rem,1.2vw,.7rem);
    color: var(--w80);
    pointer-events: none;
    opacity: 0;
    transition: opacity .18s;
    z-index: 9999;
    max-width: 200px;
  }
  .tooltip.show { opacity: 1; }

  /* ── RESPONSIVE ── */
  @media (max-width: 640px) {
    .nav-arrow { display: none; }
    .video-card { width: 100%; }
    input[type=range].vol-input { width: 50px; }
  }
  @media (max-width: 480px) {
    .canvas { padding: .5rem; gap: .4rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
<base target="_blank">
</head>
<body>

<div class="canvas">

  <!-- top progress -->
  <div class="top-bar">
    <div class="top-bar-fill" id="topBarFill"></div>
  </div>

  <!-- stage -->
  <div class="stage">
    <div class="video-card" id="videoCard">

      <!-- player area -->
      <div class="player-wrap" id="playerWrap">
        <video id="mainVideo" preload="metadata" playsinline></video>

        <!-- prev / next arrows -->
        <button class="nav-arrow prev" id="prevBtn" aria-label="Previous video">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <button class="nav-arrow next" id="nextBtn" aria-label="Next video">
          <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>

        <!-- big play overlay -->
        <div class="play-overlay" id="playOverlay">
          <button class="big-play-btn" id="bigPlayBtn" aria-label="Play">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
        </div>

        <!-- error state -->
        <div class="video-error" id="videoError">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          Video could not be loaded.<br>Check your file path or network.
        </div>
      </div>

      <!-- ── CUSTOM CONTROLS BAR ── -->
      <div class="controls-bar">

        <!-- seek row -->
        <div class="seek-row">
          <input type="range" class="seek-input" id="seekBar" min="0" max="100" value="0" step="0.1" aria-label="Seek">
          <span class="time-label" id="timeLabel">0:00 / 0:00</span>
        </div>

        <!-- button row -->
        <div class="ctrl-row">

          <!-- play/pause -->
          <button class="ctrl-btn play-pause-btn" id="playPauseBtn" aria-label="Play">
            <!-- play icon -->
            <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <!-- pause icon (hidden by default) -->
            <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>

          <!-- volume -->
          <div class="vol-group">
            <button class="ctrl-btn" id="muteBtn" aria-label="Mute">
              <svg id="iconVol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              <svg id="iconMute" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <input type="range" class="vol-input" id="volBar" min="0" max="1" step="0.02" value="1" aria-label="Volume">
          </div>

          <div class="ctrl-spacer"></div>

          <!-- playback speed -->
          <select class="speed-select" id="speedSelect" aria-label="Playback speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>

          <!-- fullscreen -->
          <button class="ctrl-btn" id="fsBtn" aria-label="Fullscreen">
            <svg id="iconFs" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            <svg id="iconFsExit" viewBox="0 0 24 24" style="display:none"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
          </button>

        </div>
      </div>
      <!-- end controls bar -->

    </div>
  </div>

  <!-- thumbnail strip -->
  <div class="thumb-strip" id="thumbStrip"></div>

  <!-- dots -->
  <div class="dots" id="dots"></div>

  <!-- footer -->
  <div class="footer">
    <span class="prog-text"><strong id="watchedCount">0</strong> / <span id="totalCount">0</span> watched</span>
    <span class="completion-lbl" id="completionLbl">Begin watching</span>
  </div>

</div>

<div class="tooltip" id="tooltip"></div>

<script>
// ================================================================
//  ██╗   ██╗██╗██████╗ ███████╗ ██████╗ ███████╗
//  ██║   ██║██║██╔══██╗██╔════╝██╔═══██╗██╔════╝
//  ██║   ██║██║██║  ██║█████╗  ██║   ██║███████╗
//  ╚██╗ ██╔╝██║██║  ██║██╔══╝  ██║   ██║╚════██║
//   ╚████╔╝ ██║██████╔╝███████╗╚██████╔╝███████║
//    ╚═══╝  ╚═╝╚═════╝ ╚══════╝ ╚═════╝ ╚══════╝
//
//  ▸ ADD, REMOVE, OR SWAP VIDEOS RIGHT HERE
//  ▸ Each entry needs: videoUrl, posterUrl
//  ▸ Full HTTPS URLs only (e.g. GitHub Pages)
//  ▸ Nothing else in this file needs to be touched
//
//  EXAMPLE:
//  { videoUrl: "https://YOUR-HOST/videos/intro.mp4",
//    posterUrl: "https://YOUR-HOST/videos/intro.jpg" }
// ================================================================

const VIDEOS = [
  {
    videoUrl:  "https://USERNAME.github.io/REPO/videos/video-01.mp4",
    posterUrl: "https://USERNAME.github.io/REPO/videos/video-01.jpg"
  },
  {
    videoUrl:  "https://USERNAME.github.io/REPO/videos/video-02.mp4",
    posterUrl: "https://USERNAME.github.io/REPO/videos/video-02.jpg"
  }
];

// ================================================================
//  END OF VIDEO CONFIGURATION — do not edit below this line
// ================================================================

const WATCH_THRESHOLD = 0.70; // mark watched after 70 % viewed

// ── DOM refs ────────────────────────────────────────────────────
const video         = document.getElementById('mainVideo');
const playerWrap    = document.getElementById('playerWrap');
const videoCard     = document.getElementById('videoCard');
const playOverlay   = document.getElementById('playOverlay');
const bigPlayBtn    = document.getElementById('bigPlayBtn');
const videoError    = document.getElementById('videoError');
const prevBtn       = document.getElementById('prevBtn');
const nextBtn       = document.getElementById('nextBtn');

const seekBar       = document.getElementById('seekBar');
const timeLabel     = document.getElementById('timeLabel');
const playPauseBtn  = document.getElementById('playPauseBtn');
const iconPlay      = document.getElementById('iconPlay');
const iconPause     = document.getElementById('iconPause');
const muteBtn       = document.getElementById('muteBtn');
const iconVol       = document.getElementById('iconVol');
const iconMute      = document.getElementById('iconMute');
const volBar        = document.getElementById('volBar');
const speedSelect   = document.getElementById('speedSelect');
const fsBtn         = document.getElementById('fsBtn');
const iconFs        = document.getElementById('iconFs');
const iconFsExit    = document.getElementById('iconFsExit');

const thumbStrip    = document.getElementById('thumbStrip');
const dotsEl        = document.getElementById('dots');
const topBarFill    = document.getElementById('topBarFill');
const watchedCountEl= document.getElementById('watchedCount');
const totalCountEl  = document.getElementById('totalCount');
const completionLbl = document.getElementById('completionLbl');
const tooltip       = document.getElementById('tooltip');

// ── State ───────────────────────────────────────────────────────
const watched = new Set();
let currentIndex = 0;
let isPlaying    = false;
let isSeeking    = false;

totalCountEl.textContent = VIDEOS.length;

// ── Helpers ─────────────────────────────────────────────────────
function fmtTime(s) {
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2,'0');
}

function updateSeekGradient() {
  const pct = seekBar.value + '%';
  seekBar.style.background =
    `linear-gradient(to right, var(--accent) ${pct}, var(--w20) ${pct})`;
}

function updateVolGradient() {
  const pct = (volBar.value * 100) + '%';
  volBar.style.background =
    `linear-gradient(to right, var(--w55) ${pct}, var(--w20) ${pct})`;
}

// ── Load video ──────────────────────────────────────────────────
function loadVideo(idx) {
  const item = VIDEOS[idx];
  video.pause();
  isPlaying = false;
  playOverlay.classList.remove('hidden');
  videoError.classList.remove('show');
  setPlayIcon(false);

  video.src = item.videoUrl;
  if (item.posterUrl) video.poster = item.posterUrl;
  video.load();

  seekBar.value = 0;
  updateSeekGradient();
  timeLabel.textContent = '0:00 / 0:00';

  refreshCard(idx);
  refreshThumbs();
  refreshDots();
  refreshNavBtns();
}

function refreshCard(idx) {
  videoCard.classList.remove('active','visited');
  if (watched.has(idx)) videoCard.classList.add('visited');
  videoCard.classList.add('active');
}

function refreshThumbs() {
  thumbStrip.querySelectorAll('.thumb').forEach((t,i) => {
    t.classList.toggle('active', i === currentIndex);
    t.classList.toggle('visited', watched.has(i));
  });
}

function refreshDots() {
  dotsEl.querySelectorAll('.dot').forEach((d,i) => {
    d.classList.toggle('active', i === currentIndex);
    d.classList.toggle('watched', watched.has(i));
  });
}

function refreshNavBtns() {
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === VIDEOS.length - 1;
}

// ── Navigation ──────────────────────────────────────────────────
function goTo(idx) {
  if (idx < 0 || idx >= VIDEOS.length) return;
  currentIndex = idx;
  loadVideo(idx);
}

prevBtn.addEventListener('click', () => goTo(currentIndex - 1));
nextBtn.addEventListener('click', () => goTo(currentIndex + 1));

// ── Playback ────────────────────────────────────────────────────
function setPlayIcon(playing) {
  iconPlay.style.display  = playing ? 'none' : '';
  iconPause.style.display = playing ? '' : 'none';
  playPauseBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
}

function togglePlay() {
  if (video.paused) {
    video.play();
  } else {
    video.pause();
  }
}

video.addEventListener('play', () => {
  isPlaying = true;
  playOverlay.classList.add('hidden');
  setPlayIcon(true);
});

video.addEventListener('pause', () => {
  isPlaying = false;
  playOverlay.classList.remove('hidden');
  setPlayIcon(false);
});

video.addEventListener('ended', () => {
  markWatched();
  setPlayIcon(false);
});

playPauseBtn.addEventListener('click', togglePlay);
bigPlayBtn.addEventListener('click',  (e) => { e.stopPropagation(); togglePlay(); });
video.addEventListener('click',        togglePlay);
playOverlay.addEventListener('click', (e) => { if (e.target === playOverlay) togglePlay(); });

// ── Watched tracking ────────────────────────────────────────────
function markWatched() {
  if (!watched.has(currentIndex)) {
    watched.add(currentIndex);
    refreshCard(currentIndex);
    refreshThumbs();
    refreshDots();
    updateProgress();
  }
}

function updateProgress() {
  const pct = (watched.size / VIDEOS.length) * 100;
  topBarFill.style.width = pct + '%';
  watchedCountEl.textContent = watched.size;
  const rem = VIDEOS.length - watched.size;
  if (rem === 0) {
    completionLbl.textContent = 'All videos watched!';
    completionLbl.style.color = 'var(--accent)';
  } else {
    completionLbl.textContent = rem + ' video' + (rem !== 1 ? 's' : '') + ' remaining';
    completionLbl.style.color = '';
  }
}

// ── Seek bar ────────────────────────────────────────────────────
video.addEventListener('timeupdate', () => {
  if (isSeeking || !video.duration) return;
  const pct = (video.currentTime / video.duration) * 100;
  seekBar.value = pct;
  updateSeekGradient();
  timeLabel.textContent = fmtTime(video.currentTime) + ' / ' + fmtTime(video.duration);
  if (video.currentTime / video.duration >= WATCH_THRESHOLD) markWatched();
});

seekBar.addEventListener('mousedown', () => { isSeeking = true; });
seekBar.addEventListener('touchstart', () => { isSeeking = true; }, { passive: true });
seekBar.addEventListener('input', () => {
  updateSeekGradient();
  if (video.duration) {
    const t = (seekBar.value / 100) * video.duration;
    timeLabel.textContent = fmtTime(t) + ' / ' + fmtTime(video.duration);
  }
});
seekBar.addEventListener('change', () => {
  if (video.duration) video.currentTime = (seekBar.value / 100) * video.duration;
  isSeeking = false;
});

// ── Volume ───────────────────────────────────────────────────────
volBar.addEventListener('input', () => {
  video.volume = volBar.value;
  video.muted = (volBar.value == 0);
  updateVolIcon();
  updateVolGradient();
});

muteBtn.addEventListener('click', () => {
  video.muted = !video.muted;
  if (!video.muted && video.volume === 0) {
    video.volume = 0.5;
    volBar.value = 0.5;
  }
  updateVolIcon();
  updateVolGradient();
});

function updateVolIcon() {
  const muted = video.muted || video.volume === 0;
  iconVol.style.display  = muted ? 'none' : '';
  iconMute.style.display = muted ? '' : 'none';
  if (!muted) { volBar.value = video.volume; }
}

// ── Speed ────────────────────────────────────────────────────────
speedSelect.addEventListener('change', () => {
  video.playbackRate = parseFloat(speedSelect.value);
});

// ── Fullscreen ───────────────────────────────────────────────────
fsBtn.addEventListener('click', () => {
  const el = playerWrap;
  if (!document.fullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen).call(document);
  }
});

document.addEventListener('fullscreenchange', updateFsIcon);
document.addEventListener('webkitfullscreenchange', updateFsIcon);
function updateFsIcon() {
  const fs = !!document.fullscreenElement;
  iconFs.style.display     = fs ? 'none' : '';
  iconFsExit.style.display = fs ? '' : 'none';
}

// ── Error ────────────────────────────────────────────────────────
video.addEventListener('error', () => {
  videoError.classList.add('show');
  playOverlay.classList.add('hidden');
});

// ── Keyboard ─────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft')            goTo(currentIndex - 1);
  if (e.key === 'ArrowRight')           goTo(currentIndex + 1);
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay(); }
  if (e.key === 'm')                    muteBtn.click();
  if (e.key === 'f')                    fsBtn.click();
});

// ── Swipe ─────────────────────────────────────────────────────────
let tx = 0;
videoCard.addEventListener('touchstart', (e) => { tx = e.changedTouches[0].screenX; }, { passive: true });
videoCard.addEventListener('touchend',   (e) => {
  const diff = tx - e.changedTouches[0].screenX;
  if (Math.abs(diff) > 50) diff > 0 ? goTo(currentIndex + 1) : goTo(currentIndex - 1);
}, { passive: true });

// ── Tooltip ───────────────────────────────────────────────────────
function showTip(e, text) {
  tooltip.textContent = text;
  tooltip.classList.add('show');
  tooltip.style.left = (e.clientX + 12) + 'px';
  tooltip.style.top  = (e.clientY + 12) + 'px';
}
function hideTip() { tooltip.classList.remove('show'); }

// ── Build thumbnails & dots ───────────────────────────────────────
VIDEOS.forEach((item, i) => {
  // thumb
  const t = document.createElement('div');
  t.className = 'thumb';
  t.dataset.index = i;

  const img = document.createElement('img');
  img.src = item.posterUrl;
  img.alt = 'Video ' + (i + 1);
  img.loading = 'lazy';
  img.onerror = function() {
    this.style.display = 'none';
    const fb = document.createElement('div');
    fb.className = 'thumb-fallback';
    fb.textContent = String(i + 1).padStart(2,'0');
    t.insertBefore(fb, t.firstChild);
  };

  const num = document.createElement('span');
  num.className = 'thumb-num';
  num.textContent = String(i + 1).padStart(2,'0');

  t.appendChild(img);
  t.appendChild(num);
  t.addEventListener('click', () => goTo(i));
  t.addEventListener('mouseenter', (e) => showTip(e, 'Video ' + (i+1) + (watched.has(i) ? ' (watched)' : '')));
  t.addEventListener('mouseleave', hideTip);
  thumbStrip.appendChild(t);

  // dot
  const d = document.createElement('div');
  d.className = 'dot';
  d.dataset.index = i;
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
});

// ── Init ──────────────────────────────────────────────────────────
updateVolGradient();
loadVideo(0);
</script>
</body>
</html>
